<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>繁體中文題庫小測驗</title>
  <style>
    :root { --primary:#2563eb; --primary-dark:#1d4ed8; --ink:#1f2937; --muted:#64748b; --line:#dbe3ef; --bg:#f4f7fb; --card:#fff; --good:#15803d; --bad:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; line-height:1.7; }
    #app { width:min(900px,calc(100% - 32px)); margin:0 auto; padding:34px 0 48px; }
    h1 { margin:0 0 8px; font-size:clamp(1.7rem,4vw,2.35rem); }
    .subtitle { margin:0; color:var(--muted); }
    .notice { padding:14px 16px; margin:22px 0; border:1px solid #f2c46d; border-radius:12px; background:#fff8e7; color:#7a4a00; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0; }
    button { border:0; border-radius:9px; padding:10px 18px; color:#fff; background:var(--primary); font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:var(--primary-dark); }
    button:disabled { cursor:not-allowed; opacity:.55; }
    #status { color:var(--muted); font-size:.95rem; }
    #message { display:none; padding:14px 16px; border-radius:10px; margin:16px 0; background:#fee2e2; color:var(--bad); white-space:pre-wrap; }
    #message.show { display:block; }
    #quiz { display:grid; gap:16px; }
    .question-card { padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 5px 18px rgba(30,64,175,.05); }
    .question-title { margin:0 0 14px; font-size:1.08rem; font-weight:700; }
    .question-number { color:var(--primary); margin-right:6px; }
    .options { display:grid; gap:9px; }
    .option { display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border:1px solid #e3e9f2; border-radius:9px; cursor:pointer; }
    .option:hover { border-color:#9dbcf7; background:#f7faff; }
    .option input { margin-top:6px; accent-color:var(--primary); }
    .option.correct { border-color:#86efac; background:#f0fdf4; }
    .option.incorrect { border-color:#fca5a5; background:#fff1f2; }
    #result { display:none; margin-top:20px; padding:16px; border-radius:12px; background:#eff6ff; color:#1e3a8a; font-size:1.1rem; font-weight:700; }
    #result.show { display:block; }
    .review { margin-top:8px; font-size:.95rem; font-weight:400; }
    .review .right { color:var(--good); }
    .review .wrong { color:var(--bad); }
    footer { margin-top:28px; color:var(--muted); font-size:.9rem; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media (max-width:560px) { #app { width:min(100% - 20px,900px); padding-top:24px; } .question-card { padding:16px; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
